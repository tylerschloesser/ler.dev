name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ler-dev-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # No `environment:` on this job: it would change the OIDC `sub` claim.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::063257577013:role/ler-dev-github-deploy
          aws-region: us-east-1

      - name: Deploy infra
        run: pnpm infra:deploy LerDevSite --require-approval never --outputs-file ../cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          echo "bucket=$(jq -r .LerDevSite.BucketName cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(jq -r .LerDevSite.DistributionId cdk-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "app-monitor=$(jq -r .LerDevSite.AppMonitorId cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Build web
        run: pnpm build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_RUM_APP_MONITOR_ID: ${{ steps.outputs.outputs.app-monitor }}

      - name: Upload to S3
        working-directory: apps/web/dist
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
        run: |
          aws s3 sync assets "s3://$BUCKET/assets" --cache-control 'public,max-age=31536000,immutable'
          aws s3 sync . "s3://$BUCKET" --exclude 'assets/*' --cache-control 'no-cache' --delete

      - name: Invalidate CloudFront
        env:
          DISTRIBUTION: ${{ steps.outputs.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      - name: Install Playwright
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e
        env:
          BASE_URL: https://ty.ler.dev
          EXPECTED_SHA: ${{ github.sha }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3
